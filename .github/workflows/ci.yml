name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tracker_test?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/tracker_test?schema=public"
      AUTH_SECRET: "test-auth-secret-32-chars-long-placeholder-key"
      GOOGLE_CLIENT_ID: "test-client-id"
      GOOGLE_CLIENT_SECRET: "test-client-secret"
      GOOGLE_OAUTH_ENCRYPTION_KEY: "test-oauth-encryption-key-32-chars-long"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun ci

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Run Linting Checks
        run: bun run lint

      - name: Run TypeScript Typecheck
        run: bunx tsc --noEmit

      - name: Check Prisma Migration Status
        continue-on-error: true
        run: bunx prisma migrate status

      - name: Check Prisma Schema/Migration Drift
        id: migration-drift
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          echo "Comparing committed migration history with prisma/schema.prisma..."
          bunx prisma migrate diff             --from-migrations prisma/migrations             --to-schema-datamodel prisma/schema.prisma             --script             2>&1 | tee migration-diff.log
          status="${PIPESTATUS[0]}"
          if [ "$status" -eq 0 ]; then
            echo "No Prisma schema/migration drift detected."
          else
            echo "::warning::Prisma schema/migration drift detected. Tests will continue against the current schema, but production migrations need reconciliation."
          fi
          exit 0

      - name: Prepare Test Database From Current Schema
        run: |
          # CI uses a disposable PostgreSQL database. db push makes the test
          # database exactly match the checked-in Prisma schema so tests do not
          # silently exercise an obsolete migration snapshot.
          bunx prisma db push --force-reset

      - name: Run Complete Test Suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          echo "Running all Bun tests under tests/ and lib/services/..."
          bun test tests/ lib/services/ 2>&1 | tee test-results.log

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ github.run_number }}
          path: test-results.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Prisma Migration Drift Log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: prisma-migration-drift-${{ github.run_number }}
          path: migration-diff.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Production Build
        if: always()
        id: build
        shell: bash
        run: |
          set -o pipefail
          echo "Running the actual production build independently of the test result..."
          bun run build 2>&1 | tee build-results.log

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-results-${{ github.run_number }}
          path: build-results.log
          if-no-files-found: warn
          retention-days: 14
